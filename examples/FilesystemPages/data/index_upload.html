	<div class="tile-container"><div class="title-image"></div><h1>Firmware Loader</h1></div>
	
	<div class="container">
		<form enctype="multipart/form-data" class="form-container" id="upload_form" method="post">
			<div id="switch-container">
				<button class="button-o left selected" id="firmware-button" type="button">Firmware</button>
				<button class="button-o right" id="filesystem-button" type="button">FileSystem</button>
			</div>

			<hr><button id="button-send" class="button-send" type="submit" disabled>Upload</button>
		</form>
		
		<script type="application/javascript">
			function stringToBoolean(string){
				switch(string.toLowerCase().trim()) {
					case "true": case "True": case "yes": case "1": return true;
					case "false": case "False": case "no": case "0": case null: return false;
					default: return Boolean(string); }}
			
			const urlParams = new URLSearchParams(window.location.search);
			const onlyFirmware = urlParams.get('onlyFirmware');
			
			if(onlyFirmware && stringToBoolean(onlyFirmware)===true) { _('switch-container').style.display = 'none'; }
			
			function disableAll() { document.getElementById("overlay").style.display = "block"; }
			function enableAll() { document.getElementById("overlay").style.display = "none"; }
			function _(el) { return document.getElementById(el); }
			
			function uploadFile() {
				var file = _("file1").files[0];
				var formdata = new FormData();
				formdata.append(_("file1").name, file, file.name);
				
				var xhttp;
				if(window.XMLHttpRequest) { xhttp = new XMLHttpRequest(); }
				else { xhttp = new ActiveXObject("Microsoft.XMLHTTP"); }
				
				xhttp.upload.addEventListener("progress", progressHandler, false);
				xhttp.addEventListener("load", completeHandler, false);
				xhttp.addEventListener("loadstart", startHandler, false);
				xhttp.addEventListener("error", errorHandler, false);
				xhttp.addEventListener("abort", abortHandler, false);
				xhttp.open("POST", "/update");
				xhttp.setRequestHeader('Access-Control-Allow-Headers', '*');
				xhttp.setRequestHeader('Access-Control-Allow-Origin', '*');
				
				xhttp.send(formdata); }
			
			function uploadStart() {
				var xhttp;
				if(window.XMLHttpRequest) { xhttp = new XMLHttpRequest(); }
				else { xhttp = new ActiveXObject("Microsoft.XMLHTTP"); }
			  
			  xhttp.open("POST","/start.php",true);
			  xhttp.send(); }
			
			function progressHandler(event) {
				_("loaded_n_total").innerHTML = "Uploaded " + event.loaded + " bytes of " + event.total;
				var percent = Math.round((event.loaded / event.total) * 100);
				_("progressBar").style = 'width: ' + percent + '%';
				_("status").innerHTML = percent + "% uploaded... please wait"; }
			
			function completeHandler(event) {
				enableAll();
				if(event.target.responseText.indexOf('error')>=0) { _("status").innerHTML = event.target.responseText; }
				else { _("status").innerHTML = 'Upload Success!'; }
				_("progressBar").value = 0; }
			
			function startHandler(event) { disableAll(); }
			function errorHandler(event) { enableAll(); _("status").innerHTML = "Upload Failed"; }
			function abortHandler(event) { enableAll(); _("status").innerHTML = "Upload Aborted"; }
			
			_('upload_form').addEventListener('submit', (e) => { e.preventDefault(); uploadStart(); uploadFile(); });
			_('firmware-button').addEventListener('click', function (e) { 
				e.target.classList.add('selected');
				_('filesystem-button').classList.remove('selected');
				_("file1").name = 'firmware'; });
        
			_('filesystem-button').addEventListener('click', function (e) {
				e.target.classList.add('selected');
				_('firmware-button').classList.remove('selected');
				_("file1").name = 'filesystem'; });
				
			_('file1').addEventListener('change', function(e){
				var file = _("file1").files[0];
				if (file && file.name){ _('button-send').disabled = false; }
				else { _('button-send').disabled = true; }
				_('status').innerHTML = "Firmware Upload!";
				_("loaded_n_total").innerHTML = ""; });

			document.getElementById("SHN").href="mailto:Sh.Nourbakhsh@Gmail.com?Subject=SHN_OTA";
		</script>
