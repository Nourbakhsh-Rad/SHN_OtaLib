	<div class="container">
		<form enctype="multipart/form-data" class="form-container">
			<table class="myTable"><tbody>
				<tr><td>Start Char </td><td><input type="number" style="width:5em" min="32" max="65" id="_sChr" value="32"> &nbsp; &nbsp;[32...65]</td></tr>

				<tr><td>Device ID </td><td><input type="text" style="width:10em" id="_id" value="7041742"></td></tr>
				<tr><td>Software Ver </td><td><input type="text" style="width:10em" id="_sw" value="1.3.6"></td></tr>

			<div class="additional-info"><h3 id="rslt">--password--</h3></div>
			<hr><br>
			<button class="button-send" onclick="GeneratePassFunc()" type="button">Generate</button>
		</form>
		
		<script type="application/javascript">
			function GeneratePassFunc()
			{
				var InChar  = document.getElementById("_id").value;
						InChar += document.getElementById("_sw").value;
						InChar += document.getElementById("_hs").value;
						InChar += document.getElementById("_hw").value;
						InChar += document.getElementById("_id").value;
				
				InChar = InChar.replaceAll(".", "");

				// Pepper set: PIN = 6 chars from [0-9A-Za-z] seeded by an FNV-1a hash of
				// everything (must match OtaCredentials::generatePin() in the firmware;
				// Start/End/Nof Char are ignored in this mode). Empty pepper: legacy
				// checksum below.
				var pepper = document.getElementById("_pepper").value;
				if(pepper.length)
				{
					var s = InChar + pepper, h = 2166136261;
					for(var k=0; k<s.length; k++) { h = Math.imul(h ^ (s.charCodeAt(k) & 0xFF), 16777619) >>> 0; }
					var alnum = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz", pin = "";
					for(var k=0; k<6; k++) { h = (Math.imul(h, 1664525) + 1013904223) >>> 0; pin += alnum[(h >>> 16) % 62]; }
					document.getElementById("rslt").innerHTML = pin;
					return;
				}

				//---------------------
				var staChar = Number(document.getElementById("_sChr").value);
				var endChar = Number(document.getElementById("_eChr").value);
				var nofChar = Number(document.getElementById("_nChr").value);
				
				//---------------------
				var len = InChar.length;
				var sum = 0;
				
				var rslt = "";
				var ri = 0;
				
				//---------------------
				for(var i=0; i<len; i++)
				{
					sum = 0;
					for(var j=i; j<(i+nofChar); j++)
					{
						if(j <len)					sum += InChar.charCodeAt(j);
					}
					
					// passCode
					sum = (sum %(endChar -staChar)) +staChar;
					
					// Correction
					if(sum <48)													sum += 33;
					else if((sum >57) && (sum <65))			sum += 39;
					else if((sum >90) && (sum <97))			sum += 20;
					else if(sum >122)										sum -= 75;
					
					if(i >0 && (i %3) ==0 && ri <6)
					{
						rslt += String.fromCharCode(sum);
						ri++;
					}
				}//for i
				
				//---------------------
				document.getElementById("rslt").innerHTML = rslt;
			}

			document.getElementById("SHN").href = "mailto:Sh.Nourbakhsh@Gmail.com?Subject=SHN%20OTApass";
		</script>
