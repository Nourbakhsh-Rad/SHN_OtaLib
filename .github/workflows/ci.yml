name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - examples/BasicHttpOta
              - examples/AccessPointOta
              - examples/FilesystemPages
              - examples/FtpFirmwareUpload
              - examples/FullFeatured
              - examples/NetworkCallbacks
              - examples/StandaloneComponents
              - examples/BootTimedApOta
              - examples/EthernetOnlyOta
              - examples/CheckFlashEncryption
          - name: ESP8266
            fqbn: esp8266:esp8266:generic
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            sketches: |
              - examples/BasicHttpOta
              - examples/AccessPointOta
              - examples/FilesystemPages
              - examples/FtpFirmwareUpload
              - examples/FullFeatured
              - examples/NetworkCallbacks
              - examples/StandaloneComponents
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketches }}
          libraries: |
            - source-path: ./
            - name: SimpleFTPServer
